# /etc/nginx/nginx.conf
user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Load MIME types so .css is served as text/css
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    server_tokens off;
    tcp_nopush on;
    tcp_nodelay on;

    # Optional: gzip (safe defaults)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json text/xml application/xml;

    # /status rate limit (10 per minute per client). Behind Traefik every request comes from the proxy,
    # so key on the right-most X-Forwarded-For entry (the one the proxy added), else the peer address.
    map $http_x_forwarded_for $status_client {
        "~(?<xff_last>[^,\s]+)\s*$" $xff_last;
        default $binary_remote_addr;
    }
    limit_req_zone $status_client zone=status_zone:1m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;
        root /var/www;
        index index.php index.html;

        # Redirects keep the public host/scheme (no internal http://host:80 in Location headers)
        absolute_redirect off;

        # One host: www.weightloss-tracker.com -> weightloss-tracker.com, same path and query (301).
        # The target is fixed, never taken from the Host header.
        if ($host ~* ^www\.) {
            return 301 https://weightloss-tracker.com$request_uri;
        }

        # Web app manifest with its proper type
        location = /site.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=86400";
            # add_header here replaces the server-level ones, so repeat them
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # Completely block access to /test/ folder in production.
        # ^~ makes this win over the regex locations below (without it /test/*.php reached PHP).
        location ^~ /test/ {
            return 404; # Return 404 to hide existence
        }

        # Never serve editor/backup copies
        location ~* \.(bak|backup|old|orig|swp)$ {
            return 404;
        }
        
        # Block sensitive files
        location ~ /\. {
            deny all;
            return 404;
        }
        
        location ~ \.(env|conf|sql)$ {
            deny all;
            return 404;
        }
        
        # Password-protected status page; status.php checks the password itself (HTTP Basic auth)
        location = /status {
            limit_req zone=status_zone burst=10 nodelay;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/status.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Public privacy and terms pages at clean URLs
        location = /privacy {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/privacy.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
        }

        location = /terms {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/terms.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Public website in four languages: English at /, /features ...; German, Spanish and French
        # under /de/, /es/, /fr/. All rendered by index.php from site/ (templates and text, never served directly).
        location ^~ /site/ {
            return 404;
        }
        location ~ ^/(de|es|fr)$ {
            return 301 /$1/;
        }
        location ~ ^/en(?:/(.*))?$ {
            return 301 /$1;
        }
        location ~ ^/(?:(?:de|es|fr)/(?:features|how-it-works|about|faq|bmi-calculator|login)?|features|how-it-works|about|faq|bmi-calculator|login)$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Never show the PHP version
        fastcgi_hide_header X-Powered-By;

        # Public routes (no auth required) - index.php, login_router.php, oauth callbacks
        location ~ ^/(index|login_router|oauth-callback-microsoft|privacy|terms)\.php$ {
            try_files $uri $uri/ =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
        }
        
        # Protected routes (require authentication) - all other PHP files
        location ~ \.php$ {
            try_files $uri $uri/ =404;

            # Use auth_request to check authentication
            auth_request /auth_gatekeeper.php;

            # Redirect to index.php if authentication fails
            error_page 401 403 = @login_redirect;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Handle authentication failures by redirecting to login
        location @login_redirect {
            return 302 /index.php;
        }
        
        # Internal auth check endpoint
        location = /auth_gatekeeper.php {
            internal;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_pass 127.0.0.1:9000;
        }
        
        # Static files with caching and security headers
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # add_header here replaces the server-level ones, so repeat them
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            try_files $uri =404;
        }
        
        # Security headers for all responses
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
